# /etc/rsyslog.d/90-siem.conf
# Forward the server's security logs to the SIEM's syslog listener:
#   auth, authpriv  SSH logins and failures, sudo
#   kern            firewall (UFW) blocks
# Real SSH login attempts against the server then appear as events and trigger rules.
# The daemon facility is left out on purpose: it carries the SIEM's own service log,
# which would feed the SIEM its own messages in a loop.
auth,authpriv.*;kern.* action(type="omfwd" target="127.0.0.1" port="5514" protocol="udp")
