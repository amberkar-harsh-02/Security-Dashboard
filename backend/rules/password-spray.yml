id: password-spray
name: Password spray
description: >
  One address failed to log in to many different accounts. Attackers try one or two
  common passwords across many accounts to stay under lockout limits.
severity: high
type: distinct
where: {category: authentication, outcome: failure}
field: user
group_by: [src_ip]
window: 5m
threshold: 8
title: "Password spray from {src_ip}"
mitre: {tactic: Credential Access, technique: T1110.003, name: Password Spraying}
